[project]
name = "agentobox-e2e"
version = "0.0.1"
requires-python = ">=3.12"
# Root project is e2e/tooling only.
# Deployable Python projects own their own pyproject.toml + uv.lock:
# - backend/
# - agent/

[dependency-groups]
e2e = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "docker>=7.1",
    "pytest-playwright>=0.7",
    "pytest-timeout>=2.3",
    "websockets>=15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring docker compose stack",
    "integration: integration tests against live services (no mocks)",
    "agent: tests that spawn real Claude Code agents (costs money)",
    "bootstrap: agent bootstrap contract tests (create -> relay connect -> idle)",
    "dashboard: tests requiring Playwright browser",
    "slow: tests with >30s execution time",
    "smoke: deploy gate smoke tests (real agent round-trip)",
]
addopts = "-m 'e2e and not agent and not dashboard' --timeout=120"
timeout = 120
