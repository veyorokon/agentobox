networks:
  agentobox:
    name: agentobox

services:
  agento:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile.agento
    container_name: abox-agento
    networks:
      - agentobox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ABOX_AGENTO_HOSTNAME=abox-agento
      - ABOX_NETWORK=agentobox
      - ABOX_EVENT_TAG=${ABOX_EVENT_TAG:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
