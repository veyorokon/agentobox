services:
  postgres:
    image: pgvector/pgvector:pg17
    mem_limit: 512m
    environment:
      POSTGRES_DB: agentobox
      POSTGRES_USER: agentobox
      POSTGRES_PASSWORD: agentobox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    mem_limit: 512m
    environment:
      SERVICES: s3,secretsmanager
      DEFAULT_REGION: us-east-1
    ports:
      - "4599:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    mem_limit: 1g
    entrypoint: ["bash", "/app/entrypoint.sh"]
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DATABASE_URL: postgres://agentobox:agentobox@postgres:5432/agentobox
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-in-production}
      AGENT_IMAGE: ${AGENT_IMAGE:-agentobox-agent-claude:latest}
      CORS_ALLOW_ALL: "true"
      ABOX_CALLBACK_URL: http://backend:8000
      ABOX_DASHBOARD_URL: http://dashboard:5051
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODAL_AGENT_IMAGE: ghcr.io/veyorokon/agentobox-agent-claude:${AGENT_VERSION:-latest}
      MODAL_ENVIRONMENT: ${MODAL_ENVIRONMENT:-dev}
      ABOX_ENCRYPTION_KEY: ${ABOX_ENCRYPTION_KEY:-}
      DOCKER_NETWORK: agentobox_default
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      MEDIA_BUCKET: ${MEDIA_BUCKET:-agentobox-media}
      MEDIA_CDN_URL: ${MEDIA_CDN_URL:-http://localhost:4566/agentobox-media}
      AGENT_ROOTFS_PATH: ${AGENT_ROOTFS_PATH:-}
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      localstack:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agent:/agent:ro
      - ./dashboard/schema.graphql:/dashboard/schema.graphql:ro

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      # Let Node use up to 8 GB heap — turbopack dev server is memory-hungry
      NODE_OPTIONS: "--max-old-space-size=8192"
    ports:
      - "5051:5051"
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  localstack-data:
