services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agentobox
      POSTGRES_USER: agentobox
      POSTGRES_PASSWORD: agentobox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    entrypoint: ["bash", "/app/entrypoint.sh"]
    command: ["uv", "run", "uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    environment:
      DATABASE_URL: postgres://agentobox:agentobox@postgres:5432/agentobox
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-only-change-in-production}
      AGENT_IMAGE: ${AGENT_IMAGE:-agentobox-agent:latest}
      ABOX_CALLBACK_URL: http://backend:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODAL_AGENT_IMAGE: ghcr.io/veyorokon/agentobox-agent:${AGENT_VERSION:-latest}
      MODAL_ENVIRONMENT: ${MODAL_ENVIRONMENT:-dev}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
      DOCKER_NETWORK: agentobox_default
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/.venv
      - /var/run/docker.sock:/var/run/docker.sock

  gda:
    build: ./backend
    entrypoint: ["bash", "/app/entrypoint.sh"]
    command: ["uv", "run", "python", "manage.py", "gda_loop"]
    environment:
      DATABASE_URL: postgres://agentobox:agentobox@postgres:5432/agentobox
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-only-change-in-production}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODAL_ENVIRONMENT: ${MODAL_ENVIRONMENT:-dev}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4318
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/.venv
      - /var/run/docker.sock:/var/run/docker.sock

  # -- SigNoz observability stack --

  signoz-init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - ./observability/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/

  signoz-zookeeper:
    image: signoz/zookeeper:3.7.1
    hostname: signoz-zookeeper
    user: root
    volumes:
      - signoz-zookeeper:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    hostname: signoz-clickhouse
    tty: true
    restart: on-failure
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./observability/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./observability/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./observability/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./observability/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./observability/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
      - signoz-clickhouse:/var/lib/clickhouse/

  signoz-schema-migrator-sync:
    image: signoz/signoz-schema-migrator:v0.129.13
    command: ["sync", "--dsn=tcp://signoz-clickhouse:9000", "--up="]
    restart: on-failure
    depends_on:
      signoz-clickhouse:
        condition: service_healthy

  signoz-schema-migrator-async:
    image: signoz/signoz-schema-migrator:v0.129.13
    command: ["async", "--dsn=tcp://signoz-clickhouse:9000", "--up="]
    restart: on-failure
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator-sync:
        condition: service_completed_successfully

  signoz:
    image: signoz/signoz:v0.110.1
    hostname: signoz
    command: ["--config=/root/config/prometheus.yml"]
    ports:
      - "8085:8080"
    volumes:
      - ./observability/signoz/prometheus.yml:/root/config/prometheus.yml
      - ./observability/dashboards:/root/config/dashboards
      - signoz-data:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - DASHBOARDS_PATH=/root/config/dashboards
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=true
      - DEPLOYMENT_TYPE=docker-standalone-amd
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator-sync:
        condition: service_completed_successfully

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:v0.129.13
    hostname: signoz-otel-collector
    command:
      [
        "--config=/etc/otel-collector-config.yaml",
        "--manager-config=/etc/manager-config.yaml",
        "--copy-path=/var/tmp/collector-config.yaml",
        "--feature-gates=-pkg.translator.prometheus.NormalizeName",
      ]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./observability/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: on-failure
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator-sync:
        condition: service_completed_successfully
      signoz:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      NEXT_PUBLIC_GRAPHQL_HTTP: http://localhost:8000/graphql
      NEXT_PUBLIC_GRAPHQL_WS: ws://localhost:8000/graphql
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  signoz-zookeeper:
  signoz-clickhouse:
  signoz-data:
