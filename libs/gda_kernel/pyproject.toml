[project]
name = "agentobox-gda-kernel"
version = "0.1.0"
description = "Internal GDA kernel contracts and control seams for Agentobox"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
