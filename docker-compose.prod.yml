services:
  redis:
    image: redis:7-alpine
    mem_limit: 128m
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/veyorokon/agentobox-backend:${VERSION:-latest}}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${DOMAIN},backend
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      ABOX_CALLBACK_URL: https://${DOMAIN}
      ABOX_DASHBOARD_URL: https://${DOMAIN}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODAL_AGENT_IMAGE: ${MODAL_AGENT_IMAGE:-ghcr.io/veyorokon/agentobox-agent-runtime-desktop-managed:${AGENT_VERSION:-${VERSION:-latest}}}
      MODAL_ENVIRONMENT: ${MODAL_ENVIRONMENT:-main}
      ABOX_ENCRYPTION_KEY: ${ABOX_ENCRYPTION_KEY}
      DOCKER_NETWORK: agentobox_default
      AWS_DEFAULT_REGION: us-east-1
      MEDIA_BUCKET: ${MEDIA_BUCKET:-agentobox-media}
      MEDIA_CDN_URL: ${MEDIA_CDN_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_RUNTIME: modal
      VOLUME_ROOT: /volumes
      LOG_FORMAT: json
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-volumes:/volumes

  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/veyorokon/agentobox-dashboard:${VERSION:-latest}}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/graphql
      DOMAIN: ${DOMAIN}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agent-volumes:
  caddy-data:
  caddy-config:
