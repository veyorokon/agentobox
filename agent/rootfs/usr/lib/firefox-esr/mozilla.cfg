// Agentobox: allow unsigned extensions (ESR only)
lockPref("xpinstall.signatures.required", false);
// Don't auto-disable sideloaded extensions (managed environment)
lockPref("extensions.autoDisableScopes", 0);
lockPref("extensions.enabledScopes", 15);

// Enable Marionette for theme hot-reload (relay.py swaps CSS at runtime)
lockPref("marionette.enabled", true);
lockPref("marionette.port", 2828);

// Register theme CSS at startup so @import in config.css resolves on first boot.
// nsIStyleSheetService registrations don't persist across restarts.
// Path: /tmp/abox-theme/ → symlinked from /vol/agents/$AGENT_ID/tmp/abox-theme/ by init-volume.
try {
    let sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
        .getService(Components.interfaces.nsIStyleSheetService);
    let uri = Components.classes["@mozilla.org/network/io-service;1"]
        .getService(Components.interfaces.nsIIOService)
        .newURI("file:///tmp/abox-theme/userChrome.css", null, null);
    if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
        sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
    }
} catch(e) {
    // intentional: CSS file may not exist yet on first boot — converters.py
    // runs during init-volume, but Firefox may start before it completes.
    Components.utils.reportError("abox: initial theme load skipped: " + e);
}
