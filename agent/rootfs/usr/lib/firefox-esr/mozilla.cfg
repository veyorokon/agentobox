// Agentobox: allow unsigned extensions (ESR only)
lockPref("xpinstall.signatures.required", false);
// Don't auto-disable sideloaded extensions (managed environment)
lockPref("extensions.autoDisableScopes", 0);
lockPref("extensions.enabledScopes", 15);

// ---------------------------------------------------------------------------
// Live theme reload via nsIStyleSheetService polling.
//
// Watches /tmp/abox-theme/userChrome.css for changes (by file size + mtime).
// When the file changes, unregisters the old sheet and re-registers the new
// one. This gives instant theme updates without restarting Firefox.
//
// Requires general.config.sandbox_enabled = false in autoconfig.js so that
// mozilla.cfg has access to Components.classes (XPCOM).
//
// Path: /tmp/abox-theme/ is symlinked from the agent volume by init-volume.
// ---------------------------------------------------------------------------

try {
    let Cc = Components.classes;
    let Ci = Components.interfaces;

    let sss = Cc["@mozilla.org/content/style-sheet-service;1"]
        .getService(Ci.nsIStyleSheetService);
    let ios = Cc["@mozilla.org/network/io-service;1"]
        .getService(Ci.nsIIOService);

    let THEME_CSS = "file:///tmp/abox-theme/userChrome.css";
    let THEME_PATH = "/tmp/abox-theme/userChrome.css";

    // State for change detection
    let _lastSize = -1;
    let _lastMtime = -1;

    function _getFileStat() {
        try {
            let file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
            file.initWithPath(THEME_PATH);
            if (file.exists()) {
                return { size: file.fileSize, mtime: file.lastModifiedTime };
            }
        } catch(e) {}
        return null;
    }

    function _reloadThemeCSS() {
        try {
            let uri = ios.newURI(THEME_CSS, null, null);
            // Unregister existing sheet first
            if (sss.sheetRegistered(uri, sss.USER_SHEET)) {
                sss.unregisterSheet(uri, sss.USER_SHEET);
            }
            // Re-register with fresh content
            sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
        } catch(e) {
            Components.utils.reportError("abox: theme reload failed: " + e);
        }
    }

    function _checkThemeChanged() {
        let stat = _getFileStat();
        if (!stat) return;
        if (stat.size !== _lastSize || stat.mtime !== _lastMtime) {
            _lastSize = stat.size;
            _lastMtime = stat.mtime;
            _reloadThemeCSS();
        }
    }

    // Initial load on startup
    _checkThemeChanged();

    // Poll every 2 seconds for changes
    let timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback(
        { notify: _checkThemeChanged },
        2000,
        Ci.nsITimer.TYPE_REPEATING_SLACK
    );

    // prevent GC of the timer
    if (typeof globalThis !== "undefined") {
        globalThis.__abox_theme_timer = timer;
    }
} catch(e) {
    // CSS file may not exist yet on first boot — converters.py runs during
    // init-volume, but Firefox may start before it completes.
    Components.utils.reportError("abox: theme polling setup failed: " + e);
}
