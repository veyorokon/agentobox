// Agentobox: allow unsigned extensions (ESR only)
lockPref("xpinstall.signatures.required", false);
// Don't auto-disable sideloaded extensions (managed environment)
lockPref("extensions.autoDisableScopes", 0);
lockPref("extensions.enabledScopes", 15);

// ---------------------------------------------------------------------------
// Live theme reload via loopback socket.
//
// Loads /tmp/abox-theme/userChrome.css at startup and whenever the relay
// pokes port 9224 after writing new CSS. The relay connects and closes —
// that's the signal to re-read the file. Instant, no polling.
//
// Requires general.config.sandbox_enabled = false in autoconfig.js so that
// mozilla.cfg has access to Components.classes (XPCOM).
//
// Path: /tmp/abox-theme/ is symlinked from the agent volume by init-volume.
// ---------------------------------------------------------------------------

try {
    let Cc = Components.classes;
    let Ci = Components.interfaces;

    let sss = Cc["@mozilla.org/content/style-sheet-service;1"]
        .getService(Ci.nsIStyleSheetService);
    let ios = Cc["@mozilla.org/network/io-service;1"]
        .getService(Ci.nsIIOService);

    let THEME_CSS = "file:///tmp/abox-theme/userChrome.css";
    let RELOAD_PORT = 9224;

    // Track the current sheet URI so we can swap atomically.
    let _currentURI = null;

    function _reloadThemeCSS() {
        try {
            // Use a cache-busting query param so Firefox re-reads the file.
            let freshURI = ios.newURI(THEME_CSS + "?t=" + Date.now(), null, null);
            // Register new sheet FIRST — it takes precedence immediately.
            sss.loadAndRegisterSheet(freshURI, sss.USER_SHEET);
            // THEN unregister the old one — no gap where defaults show through.
            if (_currentURI && sss.sheetRegistered(_currentURI, sss.USER_SHEET)) {
                sss.unregisterSheet(_currentURI, sss.USER_SHEET);
            }
            _currentURI = freshURI;
        } catch(e) {
            Components.utils.reportError("abox: theme reload failed: " + e);
        }
    }

    // Initial load on startup
    _reloadThemeCSS();

    // Listen on loopback for reload pokes from the relay.
    // Relay connects + closes after writing CSS — that's the reload signal.
    let server = Cc["@mozilla.org/network/server-socket;1"]
        .createInstance(Ci.nsIServerSocket);
    server.init(RELOAD_PORT, true, -1);  // loopback only, OS backlog
    server.asyncListen({
        onSocketAccepted: function(serv, transport) {
            _reloadThemeCSS();
            transport.close(0);
        },
        onStopListening: function() {}
    });

    // Prevent GC
    if (typeof globalThis !== "undefined") {
        globalThis.__abox_theme_server = server;
    }
} catch(e) {
    Components.utils.reportError("abox: theme reload setup failed: " + e);
}
