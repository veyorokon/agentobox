[project]
name = "agentobox-agent"
version = "0.1.0"
description = "Standalone and managed runtime for Agentobox agents"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "websockets>=15.0",
]

[project.scripts]
agentobox-agent = "agent.main:main"
agentobox-agent-managed = "agent.managed_main:main"

[dependency-groups]
dev = [
    "modal>=1.3.0",
    "pytest>=9.0",
    "ruff>=0.15.5",
]

[tool.uv]
# The agent runtime must lock successfully for both local macOS dev and Linux CI/runtime.
# This forces uv to reject wheel-only resolutions that only work on the current machine.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Agent pytest config is the authority for runtime contract markers.
markers = [
    "contract: agent runtime contract and bootstrap tests",
    "docker_contract: black-box tests that build and run the Docker-managed agent image",
]
