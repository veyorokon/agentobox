name: Bug
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What's broken in 1-2 sentences.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which agent/area owns this fix?
      options:
        - frontend
        - backend
        - agent
        - infra
        - frontend + backend
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should happen vs what does happen.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        **After filing:** Add reproduction details, workarounds, or investigation findings as comments on the issue. Issues are living documents — the body is the spec, comments are the conversation.
