name: Feature
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What and why in 2-3 sentences.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which agent/area owns this work?
      options:
        - frontend
        - backend
        - agent
        - infra
        - frontend + backend
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of what "done" looks like.
      value: |
        - [ ]
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        **After filing:** Add observations, design doubts, research findings, or scope changes as comments on the issue. Issues are living documents — the body is the spec, comments are the conversation.
