name: Promote Prod

# Production promotion pipeline.
#
# Responsibilities:
# - accept one explicit tested dev manifest ref
# - resolve and validate that manifest
# - deploy the exact artifact set to prod
# - prove the live prod environment with bootstrap + smoke
# - optionally create a GitHub Release/tag for the promoted source commit
# - automatically open a bookkeeping PR that syncs prod code into main
#
# This workflow never rebuilds images.

on:
  workflow_dispatch:
    inputs:
      manifest_ref:
        description: "Exact GHCR manifest ref to promote (e.g. ghcr.io/...:sha-abc1234)"
        required: true
        type: string
      release_version:
        description: "Optional GitHub Release/tag name (e.g. v0.1.0)"
        required: false
        type: string
      open_main_pr:
        description: "Open/update a bookkeeping PR to sync the promoted source into main"
        required: true
        type: boolean
        default: true

concurrency:
  group: promote-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  MANIFEST_IMAGE: ghcr.io/veyorokon/agentobox-release-manifest

jobs:
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend deps
        run: uv --directory backend sync --no-dev
      - name: Validate APP_SECRETS + APP_CONFIG against AppConfig schema
        env:
          _APP_CONFIG: ${{ vars.APP_CONFIG }}
          _APP_SECRETS: ${{ secrets.APP_SECRETS }}
        run: |
          eval "$(python3 -c "
          import json, os, sys

          merged = {}
          for name, env_key in [('APP_CONFIG', '_APP_CONFIG'), ('APP_SECRETS', '_APP_SECRETS')]:
              raw = os.environ.get(env_key, '')
              if raw.strip():
                  try:
                      merged.update(json.loads(raw))
                  except json.JSONDecodeError:
                      print(f'echo ERROR: {name} is not valid JSON; exit 1')
                      sys.exit(0)

          if 'DOMAIN' not in merged:
              print('echo ERROR: DOMAIN missing from APP_CONFIG; exit 1')

          for k, v in merged.items():
              safe = v.replace(\"'\", \"'\\\\''\" )
              print(f\"export {k}='{safe}'\")
          ")"
          uv --directory backend run python -c "from config.app_config import app_config; print('AppConfig OK — all required vars present')"

  resolve-manifest:
    name: Resolve Manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backend-image: ${{ steps.output.outputs.backend-image }}
      dashboard-image: ${{ steps.output.outputs.dashboard-image }}
      agent-managed-image: ${{ steps.output.outputs.agent-managed-image }}
      agent-desktop-image: ${{ steps.output.outputs.agent-desktop-image }}
      source-commit: ${{ steps.output.outputs.source-commit }}
      manifest-ref: ${{ steps.output.outputs.manifest-ref }}
      provenance: ${{ steps.output.outputs.provenance }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v1
      - name: Pull and validate manifest
        run: |
          MANIFEST_REF="${{ inputs.manifest_ref }}"
          oras pull "${MANIFEST_REF}" || {
            echo "::error::No manifest found at ${MANIFEST_REF}."
            exit 1
          }

          SOURCE_BRANCH=$(jq -r '.source_branch' manifest.json)
          PROVENANCE=$(jq -r '.provenance' manifest.json)

          if [ "${SOURCE_BRANCH}" != "dev" ] || [ "${PROVENANCE}" != "build" ]; then
            echo "::error::Prod promotions must use a normal dev build."
            echo "::error::Observed source_branch=${SOURCE_BRANCH} provenance=${PROVENANCE}."
            exit 1
          fi

          if ! printf '%s' "${MANIFEST_REF}" | grep -Eq '^ghcr\.io/veyorokon/agentobox-release-manifest:sha-[0-9a-f]{7}$'; then
            echo "::warning::Manifest ref does not match the expected immutable sha-tag pattern."
          fi
      - name: Export manifest outputs
        id: output
        run: |
          echo "backend-image=$(jq -r .backend_image manifest.json)" >> "$GITHUB_OUTPUT"
          echo "dashboard-image=$(jq -r .dashboard_image manifest.json)" >> "$GITHUB_OUTPUT"
          echo "agent-managed-image=$(jq -r .agent_managed_image manifest.json)" >> "$GITHUB_OUTPUT"
          echo "agent-desktop-image=$(jq -r .agent_desktop_image manifest.json)" >> "$GITHUB_OUTPUT"
          echo "source-commit=$(jq -r .source_commit manifest.json)" >> "$GITHUB_OUTPUT"
          echo "manifest-ref=${{ inputs.manifest_ref }}" >> "$GITHUB_OUTPUT"
          echo "provenance=$(jq -r .provenance manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: promoted-release-manifest
          path: manifest.json
          retention-days: 90

  agent-modal-contract:
    name: Agent Modal Contract (prod)
    needs: [validate-secrets, resolve-manifest]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install agent test dependencies
        run: uv --directory agent sync --group dev
      - name: Run managed Modal contract test
        env:
          AGENTOBOX_RUN_MODAL_CONTRACT_TESTS: "1"
          AGENTOBOX_MODAL_CONTRACT_IMAGE: ${{ needs.resolve-manifest.outputs.agent-desktop-image }}
          AGENTOBOX_MODAL_CONTRACT_CALLBACK_URL: https://${{ fromJson(vars.APP_CONFIG).DOMAIN }}/graphql
          MODAL_TOKEN_ID: ${{ fromJson(secrets.APP_SECRETS).MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ fromJson(secrets.APP_SECRETS).MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: main
        run: PYTHONPATH=${{ github.workspace }} uv --directory agent run pytest tests/test_managed_modal_contract.py -q -o addopts=

  deploy:
    name: Deploy (prod)
    needs: [resolve-manifest, agent-modal-contract]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - name: Prepare SSH client
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Deploy to Server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'agentobox' }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_CONFIG_JSON: ${{ vars.APP_CONFIG }}
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS }}
          BACKEND_IMAGE_REF: ${{ needs.resolve-manifest.outputs.backend-image }}
          DASHBOARD_IMAGE_REF: ${{ needs.resolve-manifest.outputs.dashboard-image }}
          MODAL_AGENT_IMAGE_REF: ${{ needs.resolve-manifest.outputs.agent-desktop-image }}
        run: |
          set -euo pipefail

          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key)

          ssh_retry() {
            local attempt
            local delay
            for attempt in 1 2 3 4 5; do
              if ssh "${ssh_opts[@]}" "$remote" "$1"; then
                return 0
              fi
              delay=$((attempt * 10))
              echo "SSH attempt ${attempt} failed; retrying in ${delay}s..."
              sleep "${delay}"
            done
            echo "::error::SSH command failed after retries."
            return 1
          }

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          merged = {}
          for env_key in ("APP_CONFIG_JSON", "APP_SECRETS_JSON"):
              raw = os.environ.get(env_key, "").strip()
              if raw:
                  merged.update(json.loads(raw))

          dynamic_refs = {
              "BACKEND_IMAGE": os.environ["BACKEND_IMAGE_REF"].strip(),
              "DASHBOARD_IMAGE": os.environ["DASHBOARD_IMAGE_REF"].strip(),
              "MODAL_AGENT_IMAGE": os.environ["MODAL_AGENT_IMAGE_REF"].strip(),
          }
          for key, value in dynamic_refs.items():
              if value:
                  merged[key] = value

          lines = []
          for key, value in sorted(merged.items()):
              safe = value.replace("'", "'\\''")
              lines.append(f"{key}='{safe}'")
          Path(".deploy.env").write_text("\n".join(lines) + "\n")
          PY

          upload_text_file() {
            local local_path="$1"
            local remote_path="$2"
            local payload
            payload="$(base64 < "$local_path" | tr -d '\n')"
            ssh_retry "mkdir -p \"$(dirname "$remote_path")\" && printf '%s' '$payload' | base64 -d > \"$remote_path\""
          }

          upload_text_file docker-compose.prod.yml /opt/agentobox/docker-compose.prod.yml
          upload_text_file Caddyfile /opt/agentobox/Caddyfile
          upload_text_file .deploy.env /opt/agentobox/.env

          ssh_retry "set -euo pipefail
          whoami
          test \"\$(whoami)\" = \"${DEPLOY_USER}\"
          id
          mkdir -p /opt/agentobox
          test -w /opt/agentobox
          : > /opt/agentobox/.deploy-preflight
          rm -f /opt/agentobox/.deploy-preflight
          echo 'Docker access OK'
          docker ps >/dev/null
          cd /opt/agentobox
          echo 'Logging into GHCR'
          echo '${GITHUB_TOKEN}' | docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin
          export VERSION=main
          export MODAL_ENVIRONMENT=main
          echo 'Pulling and starting compose stack'
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          echo 'Running migrations'
          docker compose -f docker-compose.prod.yml exec -T backend uv run python manage.py migrate --noinput
          echo 'Ensuring smoke user'
          docker compose -f docker-compose.prod.yml exec -T backend uv run python manage.py ensure_smoke_user
          echo 'Pruning old images'
          docker image prune -f"
      - name: Wait for backend startup
        run: |
          DOMAIN=$(echo '${{ vars.APP_CONFIG }}' | python3 -c "import json,sys; print(json.load(sys.stdin)['DOMAIN'])")
          for i in $(seq 1 30); do
            curl -sf "https://${DOMAIN}/graphql" -H 'Content-Type: application/json' -d '{"query":"{ __typename }"}' && break
            echo "  Waiting for backend... attempt $i/30"
            sleep 5
          done
      - name: Smoke test (HTTP surface)
        env:
          SMOKE_TEST_USER: ${{ fromJson(vars.APP_CONFIG).SMOKE_TEST_USER || 'demo' }}
          SMOKE_TEST_PASS: ${{ fromJson(secrets.APP_SECRETS).SMOKE_TEST_PASS || 'demo' }}
        run: |
          DOMAIN=$(echo '${{ vars.APP_CONFIG }}' | python3 -c "import json,sys; print(json.load(sys.stdin)['DOMAIN'])")
          bash bin/smoke-test.sh "https://${DOMAIN}"

  agent-bootstrap:
    name: Agent Bootstrap (prod)
    needs: deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --project . --group e2e
      - name: Run agent bootstrap test
        env:
          ABOX_API_URL: https://${{ fromJson(vars.APP_CONFIG).DOMAIN }}/graphql
          ABOX_TEST_USER: ${{ fromJson(vars.APP_CONFIG).SMOKE_TEST_USER || 'demo' }}
          ABOX_TEST_PASS: ${{ fromJson(secrets.APP_SECRETS).SMOKE_TEST_PASS || 'demo' }}
          SMOKE_RUNTIME: ${{ fromJson(vars.APP_CONFIG).AGENT_RUNTIME || 'modal' }}
          ABOX_TEST_AGENT_MODEL: ${{ fromJson(vars.APP_CONFIG).ABOX_TEST_AGENT_MODEL || 'claude-haiku-4-5-20251001' }}
          DIAGNOSIS_ARTIFACT_DIR: diagnosis-artifacts
        run: |
          mkdir -p diagnosis-artifacts
          uv run --project . --group e2e pytest tests/e2e/lifecycle/test_agent_boot.py::TestAgentBoot -v --timeout=300 -x --tb=long -o "addopts="
      - name: Upload failure diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnosis-agent-bootstrap
          path: diagnosis-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  agent-smoke:
    name: Agent Smoke (prod)
    needs: agent-bootstrap
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --project . --group e2e
      - name: Run agent smoke test
        env:
          ABOX_API_URL: https://${{ fromJson(vars.APP_CONFIG).DOMAIN }}/graphql
          ABOX_TEST_USER: ${{ fromJson(vars.APP_CONFIG).SMOKE_TEST_USER || 'demo' }}
          ABOX_TEST_PASS: ${{ fromJson(secrets.APP_SECRETS).SMOKE_TEST_PASS || 'demo' }}
          SMOKE_RUNTIME: ${{ fromJson(vars.APP_CONFIG).AGENT_RUNTIME || 'modal' }}
          ABOX_TEST_AGENT_MODEL: ${{ fromJson(vars.APP_CONFIG).ABOX_TEST_AGENT_MODEL || 'claude-haiku-4-5-20251001' }}
          DIAGNOSIS_ARTIFACT_DIR: diagnosis-artifacts
        run: |
          mkdir -p diagnosis-artifacts
          uv run --project . --group e2e pytest tests/smoke/ -v --timeout=300 -x --tb=long -o "addopts="
      - name: Upload failure diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnosis-agent-smoke
          path: diagnosis-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  create-release-record:
    name: Create GitHub Release
    if: success() && inputs.release_version != ''
    needs: [resolve-manifest, agent-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ needs.resolve-manifest.outputs.source-commit }}
          MANIFEST_REF: ${{ needs.resolve-manifest.outputs.manifest-ref }}
        run: |
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_VERSION} already exists; skipping."
            exit 0
          fi

          gh release create "${RELEASE_VERSION}" \
            --target "${SOURCE_COMMIT}" \
            --title "${RELEASE_VERSION}" \
            --notes "Promoted to prod from manifest \`${MANIFEST_REF}\`."

  open-main-pr:
    name: Open Main PR
    if: success() && inputs.open_main_pr
    needs: [resolve-manifest, agent-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-url: ${{ steps.pr.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create bookkeeping branch
        env:
          SOURCE_COMMIT: ${{ needs.resolve-manifest.outputs.source-commit }}
        run: |
          SHORT_SHA="${SOURCE_COMMIT::7}"
          BRANCH="release/${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout --detach "${SOURCE_COMMIT}"
          git branch -f "${BRANCH}"
          git push origin "refs/heads/${BRANCH}" --force
          echo "branch=${BRANCH}" >> "$GITHUB_ENV"
      - name: Open or reuse PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.resolve-manifest.outputs.source-commit }}
          MANIFEST_REF: ${{ needs.resolve-manifest.outputs.manifest-ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          EXISTING_URL=$(gh pr list --base main --head "${branch}" --state open --json url --jq '.[0].url // empty')
          if [ -n "${EXISTING_URL}" ]; then
            echo "url=${EXISTING_URL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE="Release: promote ${SOURCE_COMMIT::7} to main"
          if [ -n "${RELEASE_VERSION}" ]; then
            TITLE="Release: ${RELEASE_VERSION}"
          fi

          BODY=$(printf 'Promoted manifest:\n- `%s`\n\nSource commit:\n- `%s`\n\nThis PR is bookkeeping only. Prod was already deployed successfully from the manifest above.\n' "${MANIFEST_REF}" "${SOURCE_COMMIT}")

          URL=$(gh pr create --base main --head "${branch}" --title "${TITLE}" --body "${BODY}")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

  summary:
    name: summary
    if: always()
    needs:
      - validate-secrets
      - resolve-manifest
      - agent-modal-contract
      - deploy
      - agent-bootstrap
      - agent-smoke
      - create-release-record
      - open-main-pr
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - name: Compute status
        id: status
        run: |
          declare -A gates
          gates=(
            [secrets]="${{ needs.validate-secrets.result }}"
            [manifest]="${{ needs.resolve-manifest.result }}"
            [modal_contract]="${{ needs.agent-modal-contract.result }}"
            [deploy]="${{ needs.deploy.result }}"
            [bootstrap]="${{ needs.agent-bootstrap.result }}"
            [smoke]="${{ needs.agent-smoke.result }}"
            [release]="${{ needs.create-release-record.result }}"
            [main_pr]="${{ needs.open-main-pr.result }}"
          )

          overall=success
          blocked_at=""
          next_debug_target="—"
          gate_rows=""

          for gate in secrets manifest modal_contract deploy bootstrap smoke release main_pr; do
            r="${gates[$gate]}"
            case "$gate" in
              secrets) consumed="APP_CONFIG + APP_SECRETS"; debug="check Validate Secrets job output" ;;
              manifest) consumed="explicit manifest_ref"; debug="check Resolve Manifest job" ;;
              modal_contract) consumed="agent desktop image"; debug="check Agent Modal Contract job" ;;
              deploy) consumed="manifest image refs + prod env"; debug="check deploy access, compose pull, and remote host state" ;;
              bootstrap) consumed="deployed prod environment"; debug="download failure-diagnosis-agent-bootstrap" ;;
              smoke) consumed="deployed prod environment"; debug="download failure-diagnosis-agent-smoke" ;;
              release) consumed="release_version"; debug="check Create GitHub Release job" ;;
              main_pr) consumed="promoted source commit"; debug="check Open Main PR job" ;;
            esac
            gate_rows="${gate_rows}| ${gate} | \`${r}\` | ${consumed} | ${debug} |"$'\n'
            if [ "$r" != "success" ] && [ "$r" != "skipped" ] && [ -z "$blocked_at" ]; then
              overall=attention-needed
              blocked_at="$gate"
              next_debug_target="$debug"
            fi
          done

          if [ "$overall" = "success" ]; then
            echo "detail=PROMOTED" >> "$GITHUB_OUTPUT"
          else
            echo "detail=BLOCKED AT ${blocked_at}" >> "$GITHUB_OUTPUT"
          fi
          echo "overall=${overall}" >> "$GITHUB_OUTPUT"
          echo "blocked_at=${blocked_at:-—}" >> "$GITHUB_OUTPUT"
          echo "next_debug_target=${next_debug_target}" >> "$GITHUB_OUTPUT"
          {
            echo "gate_rows<<GHEOF"
            echo "$gate_rows"
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/summary-header
        with:
          title: "Promote Prod"
          overall: ${{ steps.status.outputs.overall }}
          detail: "${{ steps.status.outputs.detail }} (promote)"

      - name: Write body
        run: |
          {
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Domain | \`${{ fromJson(vars.APP_CONFIG).DOMAIN }}\` |"
            echo "| Environment | \`prod\` |"
            echo "| Mode | \`promote\` |"
            echo "| Deploy user | \`${{ vars.DEPLOY_USER || 'agentobox' }}\` |"
            echo "| Modal environment | \`main\` |"
            echo "| Source commit | \`${{ needs.resolve-manifest.outputs.source-commit || '—' }}\` |"
            echo "| Manifest ref | \`${{ needs.resolve-manifest.outputs.manifest-ref || '—' }}\` |"
            echo "| Release version | \`${{ inputs.release_version || '—' }}\` |"
            echo "| Main PR | ${{ needs.open-main-pr.outputs.pr-url || '—' }} |"
            echo
            echo "| Image | Ref |"
            echo "|-------|-----|"
            echo "| backend | \`${{ needs.resolve-manifest.outputs.backend-image || '—' }}\` |"
            echo "| dashboard | \`${{ needs.resolve-manifest.outputs.dashboard-image || '—' }}\` |"
            echo "| agent managed | \`${{ needs.resolve-manifest.outputs.agent-managed-image || '—' }}\` |"
            echo "| agent desktop | \`${{ needs.resolve-manifest.outputs.agent-desktop-image || '—' }}\` |"
            echo
            echo "| Gate | Status | Consumes | Next Debug Target |"
            echo "|------|--------|----------|-------------------|"
            echo "${{ steps.status.outputs.gate_rows }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.status.outputs.overall }}" != "success" ]; then
            failure_artifact="—"
            if echo "${{ steps.status.outputs.blocked_at }}" | grep -qi "bootstrap"; then
              failure_artifact="failure-diagnosis-agent-bootstrap"
            elif echo "${{ steps.status.outputs.blocked_at }}" | grep -qi "smoke"; then
              failure_artifact="failure-diagnosis-agent-smoke"
            fi
            {
              echo
              echo "### Diagnosis"
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| First broken gate | \`${{ steps.status.outputs.blocked_at }}\` |"
              echo "| Next debug target | ${{ steps.status.outputs.next_debug_target }} |"
              echo "| Failure artifact | \`${failure_artifact}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
