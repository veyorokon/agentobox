name: Agent Image

on:
  push:
    branches: [dev, main]
    paths: ["agent/**"]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  MANAGED_IMAGE: ghcr.io/veyorokon/agentobox-agent-runtime-managed
  DESKTOP_IMAGE: ghcr.io/veyorokon/agentobox-agent-runtime-desktop-managed

jobs:
  build-managed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      managed-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MANAGED_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: agent
          file: agent/Dockerfile.managed
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AGENTOBOX_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=managed
          cache-to: type=gha,scope=managed,mode=max

  build-desktop-managed:
    needs: build-managed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      # Build locally for contract test
      - name: Build images for contract test
        run: |
          docker build \
            -f agent/Dockerfile.managed \
            -t agentobox-agent-runtime-managed:ci \
            --build-arg AGENTOBOX_GIT_COMMIT=${{ github.sha }} \
            agent
          docker build \
            -f agent/Dockerfile.desktop.managed \
            -t agentobox-agent-runtime-desktop-managed:ci \
            --build-arg BASE_IMAGE=agentobox-agent-runtime-managed:ci \
            --build-arg AGENTOBOX_GIT_COMMIT=${{ github.sha }} \
            agent

      # Run the pytest contract test against the real image
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --directory agent --group dev
      - name: Run managed Docker contract test
        run: PYTHONPATH=${{ github.workspace }} AGENTOBOX_RUN_DOCKER_CONTRACT_TESTS=1 uv run --directory agent pytest tests/test_managed_docker_contract.py -q -o addopts=

      # Push to GHCR
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DESKTOP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: agent
          file: agent/Dockerfile.desktop.managed
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.MANAGED_IMAGE }}:${{ needs.build-managed.outputs.managed-tag }}
            AGENTOBOX_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=desktop-managed
          cache-to: type=gha,scope=desktop-managed,mode=max
