name: Agent Image

on:
  push:
    branches: [dev, main]
    paths: ["agent/**"]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/veyorokon/agentobox-agent-base
  CLAUDE_IMAGE: ghcr.io/veyorokon/agentobox-agent-claude

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BASE_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: agent
          file: agent/Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  build-claude:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build smoke-test images locally
        run: |
          docker build -f agent/Dockerfile.base -t agentobox-agent-base:ci agent
          docker build \
            -f agent/claude/Dockerfile \
            -t agentobox-agent-claude:ci \
            --build-arg BASE_IMAGE=agentobox-agent-base:ci \
            agent
      - name: Run relay runtime smoke test
        run: docker run --rm --entrypoint python3 agentobox-agent-claude:ci /opt/abox/relay.py --smoke-runtime
      - name: Run agent runtime contract
        run: bash bin/agent-runtime-contract.sh agentobox-agent-claude:ci
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CLAUDE_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: agent
          file: agent/claude/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ needs.build-base.outputs.base-tag }}
          cache-from: type=gha,scope=claude
          cache-to: type=gha,scope=claude,mode=max
