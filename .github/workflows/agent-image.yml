name: Agent Image

on:
  workflow_call:
    outputs:
      managed-image:
        description: Managed agent image ref for this commit
        value: ${{ jobs.build-managed.outputs.managed-image }}
      desktop-image:
        description: Desktop agent image ref for this commit
        value: ${{ jobs.build-desktop-managed.outputs.desktop-image }}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  MANAGED_IMAGE: ghcr.io/veyorokon/agentobox-agent-runtime-managed
  DESKTOP_IMAGE: ghcr.io/veyorokon/agentobox-agent-runtime-desktop-managed

jobs:
  build-managed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      managed-tag: ${{ steps.meta.outputs.version }}
      managed-image: ${{ steps.image-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        name: Compute short sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MANAGED_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: agent
          file: agent/Dockerfile.managed
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AGENTOBOX_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=managed
          cache-to: type=gha,scope=managed,mode=max
      - id: image-ref
        name: Record managed image ref
        run: echo "ref=${{ env.MANAGED_IMAGE }}:sha-${{ steps.sha.outputs.short }}" >> "$GITHUB_OUTPUT"

  build-desktop-managed:
    needs: build-managed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      desktop-image: ${{ steps.image-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - id: sha
        name: Compute short sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Build locally for contract test
      - name: Build images for contract test
        run: |
          docker build \
            -f agent/Dockerfile.managed \
            -t agentobox-agent-runtime-managed:ci \
            --build-arg AGENTOBOX_GIT_COMMIT=${{ github.sha }} \
            agent
          docker build \
            -f agent/Dockerfile.desktop.managed \
            -t agentobox-agent-runtime-desktop-managed:ci \
            --build-arg BASE_IMAGE=agentobox-agent-runtime-managed:ci \
            --build-arg AGENTOBOX_GIT_COMMIT=${{ github.sha }} \
            agent

      # Run the pytest contract test against the real image
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv --directory agent sync --group dev
      - name: Run managed Docker contract test
        run: PYTHONPATH=${{ github.workspace }} AGENTOBOX_RUN_DOCKER_CONTRACT_TESTS=1 uv --directory agent run pytest tests/test_managed_docker_contract.py -q -o addopts=

      # Push the exact tested desktop image to GHCR
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DESKTOP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Tag tested desktop image
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag agentobox-agent-runtime-desktop-managed:ci "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
      - name: Push tested desktop image
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
      - id: image-ref
        name: Record desktop image ref
        run: echo "ref=${{ env.DESKTOP_IMAGE }}:sha-${{ steps.sha.outputs.short }}" >> "$GITHUB_OUTPUT"
