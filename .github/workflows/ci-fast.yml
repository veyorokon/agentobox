# Fast PR checks: unit/integration/invariant/lint across backend, agent, dashboard.

name: CI Fast

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv --directory backend sync --group dev
      - name: Run unit and invariant tests
        run: uv --directory backend run pytest -m "unit or invariant" --tb=short -q

  backend-chaos:
    name: backend-chaos
    runs-on: ubuntu-latest
    needs: backend-unit
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv --directory backend sync --group dev
      - name: Run chaos tests
        run: uv --directory backend run pytest -m "chaos" --tb=short -q

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentobox
          POSTGRES_PASSWORD: agentobox
          POSTGRES_DB: agentobox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agentobox"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://agentobox:agentobox@localhost:5432/agentobox_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      AGENT_RUNTIME: docker
      AGENT_IMAGE: agentobox-agent-runtime-desktop-managed:ci
      MODAL_AGENT_IMAGE: ghcr.io/veyorokon/agentobox-agent-runtime-desktop-managed:dev
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv --directory backend sync --group dev
      - name: Run migrations
        run: uv --directory backend run python manage.py migrate --noinput
      - name: Run integration tests
        run: uv --directory backend run pytest -m "integration" --tb=short -q -o "DJANGO_SETTINGS_MODULE=config.settings"

  backend-architecture:
    name: backend-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv --directory backend sync --group dev
      - name: Run architecture checks
        run: uv --directory backend run python agents/tests/check_architecture.py

  agent-unit:
    name: agent-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install agent dependencies
        run: uv --directory agent sync --group dev
      - name: Run agent unit tests
        run: PYTHONPATH=${{ github.workspace }} uv --directory agent run pytest tests/ -q -o addopts=

  agent-lint:
    name: agent-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install agent dependencies
        run: uv --directory agent sync --group dev
      - name: Run ruff
        run: uv --directory agent run ruff check .

  dashboard-unit:
    name: dashboard-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: cd dashboard && pnpm install --frozen-lockfile
      - name: Run dashboard vitest suite
        env:
          SKIP_E2E: "1"
        run: cd dashboard && pnpm exec vitest run

  dashboard-typecheck:
    name: dashboard-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: cd dashboard && pnpm install --frozen-lockfile
      - name: Run dashboard typecheck
        run: cd dashboard && pnpm exec tsc --noEmit

  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend dependencies
        run: uv --directory backend sync --group dev
      - name: Run ruff
        run: uv --directory backend run ruff check agents/

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Dashboard dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: dashboard
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
