# PR test pipeline: unit + integration + architecture + agent + lint + docker smoke
#
# Everything here runs on PRs before merge. No external infra needed
# except an ANTHROPIC_API_KEY repo secret for the docker smoke test.

name: Tests

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_call: # Allow other workflows to call this

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend Unit + Invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run unit and invariant tests
        run: cd backend && uv run pytest -m "unit or invariant" --tb=short -q

  backend-chaos:
    name: Backend Chaos
    runs-on: ubuntu-latest
    needs: backend-unit
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run chaos tests
        run: cd backend && uv run pytest -m "chaos" --tb=short -q

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentobox
          POSTGRES_PASSWORD: agentobox
          POSTGRES_DB: agentobox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agentobox"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://agentobox:agentobox@localhost:5432/agentobox_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      AGENT_RUNTIME: docker
      AGENT_IMAGE: agentobox-agent-runtime-desktop-managed:ci
      MODAL_AGENT_IMAGE: ghcr.io/veyorokon/agentobox-agent-runtime-desktop-managed:dev
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run migrations
        run: cd backend && uv run python manage.py migrate --noinput
      - name: Run integration tests
        run: cd backend && uv run pytest -m "integration" --tb=short -q -o "DJANGO_SETTINGS_MODULE=config.settings"

  architecture:
    name: Architecture Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run architecture checks
        run: cd backend && uv run python agents/tests/check_architecture.py

  agent-unit:
    name: Agent Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install agent dependencies
        run: uv sync --package agentobox-agent --group dev
      - name: Run agent unit tests
        run: uv run --directory agent pytest tests/ -q -o addopts=

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run ruff
        run: cd backend && uv run ruff check agents/

  # ─── Docker Bootstrap + Smoke ────────────────────────────────────
  # Builds agent image, spins up full stack via docker compose, deploys
  # a real agent, sends a message, asserts response. Proves the Docker
  # runtime works end-to-end before merge.
  #
  # Uses docker-compose.ci-smoke.yml — a minimal stack (postgres, redis,
  # backend) that matches local dev networking: shared docker network,
  # named volumes, container DNS. This avoids the bare-metal pitfalls
  # (no docker socket access, no shared volumes, no container DNS).
  #
  # Requires: ANTHROPIC_API_KEY repo secret
  docker-bootstrap:
    name: Docker Bootstrap
    runs-on: ubuntu-latest
    needs: [backend-unit, agent-unit]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ABOX_ENCRYPTION_KEY: vD8UbDl_vyNWOKfYjVOWHKUlk9lpqfiLH-Esu8NB-Xg=
    steps:
      - uses: actions/checkout@v5

      - name: Skip if no API key
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::warning::ANTHROPIC_API_KEY not set — skipping docker smoke test"
          echo "SKIP_SMOKE=true" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@v6
        if: env.SKIP_SMOKE != 'true'
        with:
          enable-cache: true

      # Build agent images (plain docker build — test-only, never pushed)
      - name: Build agent runtime images
        if: env.SKIP_SMOKE != 'true'
        run: |
          docker build -t agentobox-agent-runtime-managed:latest \
            --build-arg AGENTOBOX_GIT_COMMIT=${{ github.sha }} \
            -f agent/Dockerfile.managed agent/
          docker build -t agentobox-agent-runtime-desktop-managed:latest \
            --build-arg BASE_IMAGE=agentobox-agent-runtime-managed:latest \
            --build-arg AGENTOBOX_GIT_COMMIT=${{ github.sha }} \
            -f agent/Dockerfile.desktop.managed agent/

      # Start backend stack via compose
      - name: Start backend stack
        if: env.SKIP_SMOKE != 'true'
        run: |
          docker compose -p agentobox-ci-smoke -f docker-compose.ci-smoke.yml up -d --build --wait
          # Wait for backend to be ready (migrations + seed run in entrypoint)
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/graphql -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' && break
            sleep 3
          done

      - name: Run docker bootstrap tests
        if: env.SKIP_SMOKE != 'true'
        env:
          ABOX_API_URL: http://localhost:8000/graphql
          SMOKE_RUNTIME: docker
        run: uv run --group e2e pytest tests/e2e/lifecycle/test_agent_boot.py::TestAgentBoot -v --timeout=300 -x --tb=long -o "addopts="

      - name: Dump backend logs on failure
        if: failure() && env.SKIP_SMOKE != 'true'
        run: docker compose -p agentobox-ci-smoke -f docker-compose.ci-smoke.yml logs backend --tail=500

      - name: Cleanup
        if: always() && env.SKIP_SMOKE != 'true'
        run: docker compose -p agentobox-ci-smoke -f docker-compose.ci-smoke.yml down -v

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: [docker-bootstrap]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ABOX_ENCRYPTION_KEY: vD8UbDl_vyNWOKfYjVOWHKUlk9lpqfiLH-Esu8NB-Xg=
    steps:
      - uses: actions/checkout@v5
      - name: Skip if no API key
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::warning::ANTHROPIC_API_KEY not set — skipping docker smoke test"
          echo "SKIP_SMOKE=true" >> $GITHUB_ENV
      - uses: astral-sh/setup-uv@v6
        if: env.SKIP_SMOKE != 'true'
        with:
          enable-cache: true
      - name: Build agent runtime images
        if: env.SKIP_SMOKE != 'true'
        run: |
          docker build -t agentobox-agent-runtime-managed:latest \
            --build-arg AGENTOBOX_GIT_COMMIT=${{ github.sha }} \
            -f agent/Dockerfile.managed agent/
          docker build -t agentobox-agent-runtime-desktop-managed:latest \
            --build-arg BASE_IMAGE=agentobox-agent-runtime-managed:latest \
            --build-arg AGENTOBOX_GIT_COMMIT=${{ github.sha }} \
            -f agent/Dockerfile.desktop.managed agent/
      - name: Start backend stack
        if: env.SKIP_SMOKE != 'true'
        run: |
          docker compose -p agentobox-ci-smoke -f docker-compose.ci-smoke.yml up -d --build --wait
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/graphql -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' && break
            sleep 3
          done
      - name: Run docker round-trip smoke tests
        if: env.SKIP_SMOKE != 'true'
        env:
          ABOX_API_URL: http://localhost:8000/graphql
          SMOKE_RUNTIME: docker
        run: uv run --group e2e pytest tests/smoke/ -v --timeout=300 -x --tb=long -o "addopts="
      - name: Dump backend logs on failure
        if: failure() && env.SKIP_SMOKE != 'true'
        run: docker compose -p agentobox-ci-smoke -f docker-compose.ci-smoke.yml logs backend --tail=500
      - name: Cleanup
        if: always() && env.SKIP_SMOKE != 'true'
        run: docker compose -p agentobox-ci-smoke -f docker-compose.ci-smoke.yml down -v
