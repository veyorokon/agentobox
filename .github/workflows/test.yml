# PR test pipeline: unit + integration + architecture + agent + lint + docker smoke
#
# Everything here runs on PRs before merge. No external infra needed
# except an ANTHROPIC_API_KEY repo secret for the docker smoke test.

name: Tests

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_call: # Allow other workflows to call this

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend Unit + Invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run unit and invariant tests
        run: cd backend && uv run pytest -m "unit or invariant" --tb=short -q

  backend-chaos:
    name: Backend Chaos
    runs-on: ubuntu-latest
    needs: backend-unit
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run chaos tests
        run: cd backend && uv run pytest -m "chaos" --tb=short -q

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentobox
          POSTGRES_PASSWORD: agentobox
          POSTGRES_DB: agentobox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agentobox"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://agentobox:agentobox@localhost:5432/agentobox_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      AGENT_RUNTIME: docker
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run migrations
        run: cd backend && uv run python manage.py migrate --noinput
      - name: Run integration tests
        run: cd backend && uv run pytest -m "integration" --tb=short -q -o "DJANGO_SETTINGS_MODULE=config.settings"

  architecture:
    name: Architecture Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run architecture invariant tests
        run: uv run --directory backend pytest ../tests/architecture/ --tb=short -q -o "addopts="

  agent-unit:
    name: Agent Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install agent test dependencies
        run: |
          SDK_VERSION=$(grep -oP 'claude-agent-sdk==\K[^\s\\]+' agent/claude/Dockerfile)
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.2 websockets==16.0 "claude-agent-sdk==${SDK_VERSION}" fastapi httpx
      - name: Run agent unit tests
        run: cd agent && python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run ruff
        run: cd backend && uv run ruff check agents/

  # ─── Docker Smoke ─────────────────────────────────────────────────
  # Builds agent image, spins up full stack, deploys a real agent,
  # sends a message, asserts response. Proves the Docker runtime
  # works end-to-end before merge.
  #
  # Requires: ANTHROPIC_API_KEY repo secret
  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: [backend-unit, agent-unit]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentobox
          POSTGRES_PASSWORD: agentobox
          POSTGRES_DB: agentobox
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agentobox"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://agentobox:agentobox@localhost:5432/agentobox
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-smoke-secret-key-not-for-production
      AGENT_RUNTIME: docker
      DJANGO_SETTINGS_MODULE: config.settings
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ABOX_ENCRYPTION_KEY: vD8UbDl_vyNWOKfYjVOWHKUlk9lpqfiLH-Esu8NB-Xg=
    steps:
      - uses: actions/checkout@v5

      - name: Skip if no API key
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::warning::ANTHROPIC_API_KEY not set — skipping docker smoke test"
          echo "SKIP_SMOKE=true" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@v6
        if: env.SKIP_SMOKE != 'true'
        with:
          enable-cache: true

      # Build agent images (plain docker build — test-only, never pushed)
      - name: Build agent base image
        if: env.SKIP_SMOKE != 'true'
        run: docker build -t agentobox-agent-base:latest -f agent/Dockerfile.base agent/

      - name: Build agent claude image
        if: env.SKIP_SMOKE != 'true'
        run: docker build -t agentobox-agent-claude:latest --build-arg BASE_IMAGE=agentobox-agent-base:latest -f agent/claude/Dockerfile agent/

      # Start backend
      - name: Install backend dependencies
        if: env.SKIP_SMOKE != 'true'
        run: cd backend && uv sync --group dev

      - name: Run migrations + seed
        if: env.SKIP_SMOKE != 'true'
        run: |
          cd backend
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_dev_data

      - name: Start backend
        if: env.SKIP_SMOKE != 'true'
        run: |
          cd backend
          uv run daphne -b 0.0.0.0 -p 8000 config.asgi:application &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/graphql -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' && break
            sleep 2
          done

      - name: Verify login works
        if: env.SKIP_SMOKE != 'true'
        run: |
          # Debug: verify demo user can login before running tests
          RESULT=$(curl -sf http://localhost:8000/graphql -H 'Content-Type: application/json' \
            -d '{"query":"mutation { login(input: { username: \"demo\", password: \"demo\" }) { token } }"}')
          echo "Login result: $RESULT"
          echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'errors' not in d, f'Login failed: {d}'; print('Login OK')"

      # Run smoke tests
      - name: Run docker smoke tests
        if: env.SKIP_SMOKE != 'true'
        env:
          ABOX_API_URL: http://localhost:8000/graphql
          SMOKE_RUNTIME: docker
        run: uv run --group e2e pytest tests/smoke/ -v --timeout=300 -x --tb=long -o "addopts="
