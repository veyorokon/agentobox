name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit + Invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run unit and invariant tests
        run: cd backend && uv run pytest -m "unit or invariant" --tb=short -q

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentobox
          POSTGRES_PASSWORD: agentobox
          POSTGRES_DB: agentobox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agentobox"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://agentobox:agentobox@localhost:5432/agentobox_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run migrations
        run: cd backend && uv run python manage.py migrate --noinput
      - name: Run integration tests
        run: cd backend && uv run pytest -m "integration" --tb=short -q -o "DJANGO_SETTINGS_MODULE=config.settings"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run ruff
        run: cd backend && uv run ruff check agents/
