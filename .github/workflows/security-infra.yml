name: Security Infra

on:
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/security-infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/security-infra.yml"
  workflow_dispatch:
  schedule:
    - cron: "22 7 * * *"

concurrency:
  group: security-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-infra:
    name: trivy-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Trivy infra config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: infra
          scanners: config
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Security Infra Summary"
            echo
            echo "- ref: \`${{ github.ref_name }}\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- overall: \`${{ job.status }}\`"
            echo "- scan_path: \`infra\`"
            echo "- scanner: \`trivy config\`"
            echo "- severity_threshold: \`HIGH,CRITICAL\`"
          } >> "$GITHUB_STEP_SUMMARY"
