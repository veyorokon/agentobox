# Deploy pipeline: test → build → deploy → modal smoke
#
# Branch → environment mapping:
#   dev  branch → dev  environment (dev.agentobox.com)
#   main branch → prod environment (agentobox.com)
#
# Flow:
#   PR → dev:  unit + docker smoke (test.yml)
#   merge dev: deploy to dev → modal smoke against dev.agentobox.com
#   merge main: deploy to prod → modal smoke against agentobox.com
#
# Required GitHub Secrets (per environment):
#   DEPLOY_HOST     — Server IP or domain
#   DEPLOY_SSH_KEY  — SSH private key for ubuntu user
#   APP_SECRETS     — JSON object of actual secrets (DATABASE_URL, SECRET_KEY,
#                     ABOX_ENCRYPTION_KEY, MODAL_TOKEN_*, OAuth secrets, etc.)
#
# Required GitHub Variables (per environment):
#   APP_CONFIG      — JSON object of non-secret config (DOMAIN, OAuth client IDs,
#                     MEDIA_BUCKET, MEDIA_CDN_URL, SMOKE_TEST_USER, etc.)
#
# Both are merged into /opt/agentobox/.env on each deploy. Secrets are write-only
# in GitHub; config is readable and individually editable.

name: Deploy

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/veyorokon/agentobox-backend
  DASHBOARD_IMAGE: ghcr.io/veyorokon/agentobox-dashboard

jobs:
  # ─── Validate Secrets ─────────────────────────────────────────────
  # Runs in parallel with tests. Fails fast if APP_SECRETS is missing
  # required keys. Uses pydantic AppConfig as the schema — no hardcoded
  # key list to maintain. If app_config imports, all required vars exist.
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend deps
        run: cd backend && uv sync --no-dev
      - name: Validate APP_SECRETS + APP_CONFIG against AppConfig schema
        run: |
          # Merge APP_CONFIG (non-secret) + APP_SECRETS (secret) into env vars
          eval "$(python3 -c "
          import json, sys

          merged = {}

          config_raw = '''${{ vars.APP_CONFIG }}'''
          if config_raw.strip():
              try:
                  merged.update(json.loads(config_raw))
              except json.JSONDecodeError:
                  print('echo ERROR: APP_CONFIG is not valid JSON; exit 1')
                  sys.exit(0)

          secrets_raw = '''${{ secrets.APP_SECRETS }}'''
          if secrets_raw.strip():
              try:
                  merged.update(json.loads(secrets_raw))
              except json.JSONDecodeError:
                  print('echo ERROR: APP_SECRETS is not valid JSON; exit 1')
                  sys.exit(0)

          if 'DOMAIN' not in merged:
              print('echo ERROR: DOMAIN missing from APP_CONFIG; exit 1')

          for k, v in merged.items():
              safe = v.replace(\"'\", \"'\\\\''\" )
              print(f\"export {k}='{safe}'\")
          ")"
          cd backend && uv run python -c "from config.app_config import app_config; print('AppConfig OK — all required vars present')"

  # ─── Test ──────────────────────────────────────────────────────────
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # ─── Build ─────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [tests, validate-secrets]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image
      - id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Dashboard image
      - id: dashboard-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DASHBOARD_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: dashboard
          file: dashboard/Dockerfile
          push: true
          tags: ${{ steps.dashboard-meta.outputs.tags }}
          labels: ${{ steps.dashboard-meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  # ─── Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ github.ref_name }})
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - name: Write .env from APP_SECRETS + APP_CONFIG
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/agentobox
            python3 -c "
            import json, sys

            merged = {}

            # APP_CONFIG (non-secret, readable in GitHub UI)
            config_raw = '''${{ vars.APP_CONFIG }}'''
            if config_raw.strip():
                merged.update(json.loads(config_raw))

            # APP_SECRETS (write-only, overrides config if keys overlap)
            secrets_raw = '''${{ secrets.APP_SECRETS }}'''
            if secrets_raw.strip():
                merged.update(json.loads(secrets_raw))

            lines = []
            for k, v in sorted(merged.items()):
                safe = v.replace(chr(39), chr(39)+chr(92)+chr(39)+chr(39))
                lines.append(k + '=' + chr(39) + safe + chr(39))
            print(chr(10).join(lines))
            " > /opt/agentobox/.env

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/agentobox

            # Pull images tagged with branch name (dev → :dev, main → :main)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export VERSION=${{ github.ref_name }}
            export MODAL_ENVIRONMENT=${{ github.ref_name }}

            docker compose -f docker-compose.prod.yml pull

            # Deploy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T backend uv run python manage.py migrate --noinput

            # Ensure smoke test user exists (for CI agent-smoke job)
            docker compose -f docker-compose.prod.yml exec -T backend uv run python manage.py ensure_smoke_user

            # Cleanup old images
            docker image prune -f

      - name: Wait for backend startup
        run: |
          DOMAIN=$(echo '${{ vars.APP_CONFIG }}' | python3 -c "import json,sys; print(json.load(sys.stdin)['DOMAIN'])")
          for i in $(seq 1 30); do
            curl -sf "https://${DOMAIN}/graphql" -H 'Content-Type: application/json' \
              -d '{"query":"{ __typename }"}' && break
            echo "  Waiting for backend... attempt $i/30"
            sleep 5
          done

      - name: Smoke test (HTTP surface)
        run: |
          DOMAIN=$(echo '${{ vars.APP_CONFIG }}' | python3 -c "import json,sys; print(json.load(sys.stdin)['DOMAIN'])")
          bash bin/smoke-test.sh "https://${DOMAIN}"

  # ─── Agent Smoke (Modal) ───────────────────────────────────────────
  # Runs a real agent end-to-end against the deployed environment.
  # Creates agent → waits for relay → sends message → asserts response.
  #
  # Runs on both dev and main after deploy. Uses the environment's
  # Modal credentials (dev Modal env for dev, prod Modal env for main).
  agent-smoke:
    name: Agent Smoke (${{ github.ref_name }})
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --group e2e

      - name: Run agent smoke test
        env:
          ABOX_API_URL: https://${{ fromJson(vars.APP_CONFIG).DOMAIN }}/graphql
          ABOX_TEST_USER: ${{ fromJson(vars.APP_CONFIG).SMOKE_TEST_USER || 'demo' }}
          ABOX_TEST_PASS: ${{ fromJson(secrets.APP_SECRETS).SMOKE_TEST_PASS || 'demo' }}
          SMOKE_RUNTIME: ${{ fromJson(vars.APP_CONFIG).AGENT_RUNTIME || 'modal' }}
        run: uv run pytest tests/smoke/ -v --timeout=300 -x --tb=long -o "addopts="
