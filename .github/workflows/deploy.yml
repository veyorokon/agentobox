# Deploy pipeline: test → build → deploy
#
# Required GitHub Secrets:
#   EC2_HOST     — EC2 public IP or domain
#   EC2_SSH_KEY  — SSH private key for ubuntu user
#
# Required GitHub Environment: "dev"
#
# The .env file with app secrets (SECRET_KEY, DATABASE_URL, etc.) must already
# exist on the server at /opt/agentobox/.env — placed manually during initial
# setup or managed via GitHub environment secrets.

name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/veyorokon/agentobox-backend
  DASHBOARD_IMAGE: ghcr.io/veyorokon/agentobox-dashboard

jobs:
  # ─── Test ──────────────────────────────────────────────────────────
  backend-unit:
    name: Backend Unit + Invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run unit and invariant tests
        run: cd backend && uv run pytest -m "unit or invariant" --tb=short -q

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentobox
          POSTGRES_PASSWORD: agentobox
          POSTGRES_DB: agentobox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agentobox"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://agentobox:agentobox@localhost:5432/agentobox_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run migrations
        run: cd backend && uv run python manage.py migrate --noinput
      - name: Run integration tests
        run: cd backend && uv run pytest -m "integration" --tb=short -q -o "DJANGO_SETTINGS_MODULE=config.settings"

  agent-unit:
    name: Agent Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent test dependencies
        run: |
          SDK_VERSION=$(sed -n 's/.*claude-agent-sdk==\([^[:space:]\\]*\).*/\1/p' agent/claude/Dockerfile)
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.2 websockets==16.0 "claude-agent-sdk==${SDK_VERSION}"
      - name: Run agent unit tests
        run: cd agent && python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd backend && uv sync --group dev
      - name: Run ruff
        run: cd backend && uv run ruff check agents/

  # ─── Build ─────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, agent-unit, lint]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image
      - id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Dashboard image
      - id: dashboard-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DASHBOARD_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/Dockerfile
          push: true
          tags: ${{ steps.dashboard-meta.outputs.tags }}
          labels: ${{ steps.dashboard-meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  # ─── Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/agentobox

            # Pull latest images
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            VERSION=${{ github.sha }} docker compose -f docker-compose.prod.yml pull

            # Deploy
            VERSION=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Run migrations
            VERSION=${{ github.sha }} docker compose -f docker-compose.prod.yml exec -T backend uv run python manage.py migrate --noinput

            # Cleanup old images
            docker image prune -f
