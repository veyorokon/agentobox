# Deploy pipeline: test → build → deploy
#
# Branch → environment mapping:
#   dev  branch → dev  environment (dev.agentobox.com)
#   main branch → prod environment (agentobox.com) [future]
#
# Required GitHub Secrets (per environment):
#   DEPLOY_HOST     — Server IP or domain
#   DEPLOY_SSH_KEY  — SSH private key for ubuntu user
#   APP_SECRETS     — JSON object of all app env vars (DATABASE_URL, SECRET_KEY,
#                     GOOGLE_CLIENT_ID, etc.). Written to /opt/agentobox/.env on
#                     each deploy. One secret per environment = zero server config.

name: Deploy

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/veyorokon/agentobox-backend
  DASHBOARD_IMAGE: ghcr.io/veyorokon/agentobox-dashboard

jobs:
  # ─── Test ──────────────────────────────────────────────────────────
  tests:
    uses: ./.github/workflows/test.yml

  # ─── Build ─────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image
      - id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Dashboard image
      - id: dashboard-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DASHBOARD_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/Dockerfile
          push: true
          tags: ${{ steps.dashboard-meta.outputs.tags }}
          labels: ${{ steps.dashboard-meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  # ─── Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ github.ref_name }})
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from APP_SECRETS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/agentobox
            echo '${{ secrets.APP_SECRETS }}' | python3 -c "
            import json, sys
            d = json.load(sys.stdin)
            print('\n'.join(f'{k}={v}' for k, v in d.items()))
            " > /opt/agentobox/.env

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/agentobox

            # Pull images tagged with branch name (dev → :dev, main → :main)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            VERSION=${{ github.ref_name }} docker compose -f docker-compose.prod.yml pull

            # Deploy
            VERSION=${{ github.ref_name }} docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Run migrations
            VERSION=${{ github.ref_name }} docker compose -f docker-compose.prod.yml exec -T backend uv run python manage.py migrate --noinput

            # Cleanup old images
            docker image prune -f
