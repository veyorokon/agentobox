[project]
name = "agentobox"
version = "0.1.0"
description = "Goal-driven agent orchestration platform"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.38.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "cryptography>=44.0.0",
    "daphne>=4.2.1",
    "django>=6.0.2",
    "django-cors-headers>=4.7.0",
    "django-environ>=0.12.0",
    "fastmcp>=3.0.0",
    "django-structlog>=10.0.0",
    "docker>=7.1.0",
    "modal>=1.3.2",
    "orjson>=3.11.7",
    "pgvector>=0.4.2",  # Required by 0001_initial migration (VectorExtension, VectorField); removable after migration squash
    "psycopg[binary]>=3.3.2",
    "pyjwt>=2.11.0",
    "strawberry-graphql>=0.291.0",
    "strawberry-graphql-django>=0.75.0",
    "structlog>=25.5.0",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.9.0",
    "pytest-asyncio>=0.24.0",
    "factory-boy>=3.3.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = [
    "agents",
    "projects",
    "accounts",
    "config",
]
