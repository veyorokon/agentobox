[project]
name = "agentobox"
version = "0.1.0"
description = "Goal-driven agent orchestration platform"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.1",
    "django>=6.0.2",
    "django-environ>=0.12.0",
    "django-structlog>=10.0.0",
    "docker>=7.1.0",
    "litellm>=1.81.8",
    "modal>=1.3.2",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1",
    "opentelemetry-instrumentation-django>=0.60b1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "opentelemetry-instrumentation-psycopg>=0.60b1",
    "opentelemetry-sdk>=1.39.1",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.2",
    "pyjwt>=2.11.0",
    "strawberry-graphql>=0.291.0",
    "strawberry-graphql-django>=0.75.0",
    "structlog>=25.5.0",
]
